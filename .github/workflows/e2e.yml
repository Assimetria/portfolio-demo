# ─────────────────────────────────────────────────────────────────────────────
# E2E — Playwright against the production build (optional, not a merge gate).
#
# Nightly + on demand. Builds the client, boots the Express server the same way
# the Docker image does (NODE_ENV=production, no reachable database → degraded)
# and runs the public-page / brand / navigation / accessibility specs in
# Chromium. Pass `base_url` to run the suite against a deployed app instead.
# ─────────────────────────────────────────────────────────────────────────────

name: E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Run against an already-deployed app (leave empty to build + serve locally)
        required: false
        default: ""
      all_browsers:
        description: Also run Firefox, WebKit and mobile Chrome
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      BASE_URL: ${{ inputs.base_url }}
      PLAYWRIGHT_ALL_BROWSERS: ${{ inputs.all_browsers == true && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund --prefix client
          npm ci --ignore-scripts --no-audit --no-fund --prefix server

      - name: Build client
        if: inputs.base_url == ''
        run: npm run build

      - name: Install Playwright browsers
        run: |
          if [ "$PLAYWRIGHT_ALL_BROWSERS" = "1" ]; then
            npx playwright install --with-deps
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run Playwright
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
