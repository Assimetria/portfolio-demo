# ─────────────────────────────────────────────────────────────────────────────
# Deploy — Docker build → ECR (:<sha> + :latest) → App Runner start-deployment
#
# Runs ONLY after the CI workflow has completed successfully for a push to
# main (workflow_run), or when triggered by hand (workflow_dispatch). A push
# to main that fails CI therefore never reaches production.
#
# Secrets — exactly the ones Orkosi provisioning sets on every customer repo:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, ECR_REPO_NAME, APP_RUNNER_SERVICE_ARN
# Optional:
#   APP_HEALTH_URL (secret or repository variable) — public READINESS URL to
#   verify after the rollout, e.g. https://acme.orkosi.app/api/ready. When it
#   is absent the App Runner service domain + /api/ready is used instead.
#   /api/ready answers 503 until the database is reachable, so a rollout whose
#   image cannot reach RDS fails here instead of passing on liveness alone.
#
# The App Runner service tracks <ecr-repo>:latest with auto-deploy disabled, so
# pushing :latest and calling start-deployment is what rolls the new image out.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    # CI also runs on `dev` (customer repos' default branch). `branches` filters
    # on the triggering run's head branch, so `dev` completions never reach this
    # workflow; the preflight `if` below re-checks head_branch as a second guard.
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or ref to deploy (defaults to main HEAD)
        required: false
        default: main

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  # ── Do we have somewhere to deploy to? ──────────────────────────────────────
  # The template repository itself (and a customer repo whose provisioning has
  # not finished) has no deployment secrets. Skip with a notice instead of
  # failing every push to main; a manual run without secrets is still an error.
  preflight:
    name: preflight
    # workflow_run fires for every CI completion — only consider green pushes to main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check deployment secrets
        id: check
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ECR_REPO_NAME: ${{ secrets.ECR_REPO_NAME }}
          APP_RUNNER_SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN }}
        run: |
          missing=""
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY ECR_REPO_NAME APP_RUNNER_SERVICE_ARN; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Missing GitHub Actions secrets:$missing — Orkosi provisioning sets these (Code + Hosting steps)."
            exit 1
          fi
          echo "::notice::Deploy skipped — no deployment target configured (missing secrets:$missing). This is expected on the template repository."

  deploy:
    name: deploy
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve commit to deploy
        id: rev
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ inputs.ref || 'main' }}"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying $SHA"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.rev.outputs.sha }}

      - name: Record resolved SHA + build date
        id: sha
        run: |
          FULL=$(git rev-parse HEAD)
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "short=${FULL:0:8}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image (:sha + :latest, layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPO_NAME }}:${{ steps.sha.outputs.full }}
            ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPO_NAME }}:latest
          build-args: |
            BUILD_SHA=${{ steps.sha.outputs.full }}
            BUILD_DATE=${{ steps.sha.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # App Runner needs a plain single-platform image manifest (no attestation index).
          provenance: false
          sbom: false

      - name: Start App Runner deployment
        id: start
        env:
          SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN }}
        run: |
          STATUS=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query 'Service.Status' --output text)
          echo "Service status before deploy: $STATUS"
          if [ "$STATUS" = "OPERATION_IN_PROGRESS" ]; then
            echo "::error::App Runner service is busy (OPERATION_IN_PROGRESS) — re-run this workflow when the current operation finishes."
            exit 1
          fi
          OP_ID=$(aws apprunner start-deployment --service-arn "$SERVICE_ARN" --query 'OperationId' --output text)
          echo "operation_id=$OP_ID" >> "$GITHUB_OUTPUT"
          echo "Started deployment operation $OP_ID"

      - name: Wait for App Runner to reach RUNNING (max 15 min)
        env:
          SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN }}
          OP_ID: ${{ steps.start.outputs.operation_id }}
        run: |
          for i in $(seq 1 60); do
            OP_STATUS=$(aws apprunner list-operations --service-arn "$SERVICE_ARN" --max-results 20 \
              --query "OperationSummaryList[?Id=='${OP_ID}'].Status | [0]" --output text 2>/dev/null || echo "UNKNOWN")
            SVC_STATUS=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query 'Service.Status' --output text)
            echo "[$i/60] operation=$OP_STATUS service=$SVC_STATUS"
            case "$OP_STATUS" in
              SUCCEEDED)
                if [ "$SVC_STATUS" = "RUNNING" ]; then echo "Deployment succeeded"; exit 0; fi ;;
              FAILED|ROLLBACK_IN_PROGRESS|ROLLBACK_FAILED|ROLLBACK_SUCCEEDED)
                echo "::error::App Runner deployment $OP_STATUS — the new image failed its health check; App Runner kept/restored the previous version."
                exit 1 ;;
            esac
            case "$SVC_STATUS" in
              CREATE_FAILED|DELETE_FAILED|DELETED)
                echo "::error::App Runner service in terminal state $SVC_STATUS"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out after 15 min waiting for App Runner deployment $OP_ID"
          exit 1

      - name: Verify public readiness endpoint (/api/ready)
        env:
          APP_HEALTH_URL: ${{ secrets.APP_HEALTH_URL || vars.APP_HEALTH_URL }}
          SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN }}
        run: |
          if [ -z "$APP_HEALTH_URL" ]; then
            SERVICE_URL=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query 'Service.ServiceUrl' --output text)
            APP_HEALTH_URL="https://${SERVICE_URL}/api/ready"
            echo "APP_HEALTH_URL not set — using the App Runner domain: $APP_HEALTH_URL"
          fi
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /tmp/ready.json -w '%{http_code}' --max-time 15 "$APP_HEALTH_URL" || echo 000)
            echo "[$i/12] $APP_HEALTH_URL → HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/ready.json; echo
              exit 0
            fi
            sleep 10
          done
          echo "::error::Readiness check failed — $APP_HEALTH_URL never returned 200 (503 = database unreachable; see body below)"
          cat /tmp/ready.json 2>/dev/null; echo
          exit 1

      - name: Summary
        if: always()
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_REPO_NAME }}
        run: |
          {
            echo "### Deploy ${{ steps.sha.outputs.short }} — ${{ job.status }}"
            echo ""
            echo "- Image: \`$REGISTRY/$REPO:${{ steps.sha.outputs.full }}\` (also \`:latest\`)"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- App Runner operation: \`${{ steps.start.outputs.operation_id || 'n/a' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
