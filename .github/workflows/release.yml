# ─────────────────────────────────────────────────────────────────────────────
# Release — turn a VERSION bump on main into an annotated tag + GitHub Release.
#
# This is how template improvements reach every customer: Orkosi watches the
# `v*` tags of each template repo (product_types.template_repo), reads the
# CHANGELOG section published here as the release body, and shows
# "Version X.Y.Z available — upgrade?" in the customer dashboard.
#
# Runs only in the TEMPLATE repository (template-manifest.json.templateRepo ==
# github.repository). Customer repos inherit this file through @system sync but
# skip it, so their own VERSION changes (from upgrades) never create tags.
#
# The bump itself is made by `node scripts/@system/version.js --bump …`, which
# updates VERSION, template-manifest.json, package.json and CHANGELOG.md in one
# commit; `--check` below refuses to tag when they disagree, so tag == VERSION.
# Idempotent: re-running for an existing tag/release is a no-op.
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: tag-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version and contract
        id: meta
        run: |
          set -euo pipefail
          TEMPLATE_REPO="$(node -p 'require("./template-manifest.json").templateRepo || ""')"
          if [ "$TEMPLATE_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::notice::$GITHUB_REPOSITORY is not the template repository ($TEMPLATE_REPO) — no tag created"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/@system/version.js --check
          VERSION="$(node scripts/@system/version.js)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::notice::tag v$VERSION already exists"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          fi
          node scripts/@system/version.js --changelog "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          # Annotated-tag message: first line is the tag name, then the release notes
          # (git refuses an empty message and does not allow -m together with -F).
          { echo "v$VERSION"; echo; cat "$RUNNER_TEMP/release-notes.md"; } > "$RUNNER_TEMP/tag-message.md"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag
        if: steps.meta.outputs.skip == 'false' && steps.meta.outputs.tag_exists != 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -F "$RUNNER_TEMP/tag-message.md" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"

      - name: Publish GitHub Release
        if: steps.meta.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::notice::release v$VERSION already exists"
            exit 0
          fi
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "$GITHUB_SHA"
