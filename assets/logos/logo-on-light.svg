<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Assimetria logo-on-light: dark circle with light pixel dissolve (for light backgrounds) -->
  <defs>
    <clipPath id="circle"><circle cx="256" cy="256" r="240"/></clipPath>
  </defs>
  <circle cx="256" cy="256" r="240" fill="#1a1a2e"/>
  <!-- Pixel dissolve pattern — left side solid, right side dissolving into dots -->
  <g clip-path="url(#circle)">
    <rect x="16" y="16" width="240" height="480" fill="#e2e8f0" rx="0"/>
    <!-- Dissolving edge pixels -->
    <rect x="256" y="32" width="24" height="24" fill="#e2e8f0" opacity="0.95"/>
    <rect x="256" y="64" width="24" height="24" fill="#e2e8f0" opacity="0.92"/>
    <rect x="256" y="96" width="24" height="24" fill="#e2e8f0" opacity="0.9"/>
    <rect x="256" y="128" width="24" height="24" fill="#e2e8f0"/>
    <rect x="256" y="160" width="24" height="24" fill="#e2e8f0"/>
    <rect x="256" y="192" width="24" height="24" fill="#e2e8f0"/>
    <rect x="256" y="224" width="24" height="24" fill="#e2e8f0"/>
    <rect x="256" y="256" width="24" height="24" fill="#e2e8f0"/>
    <rect x="256" y="288" width="24" height="24" fill="#e2e8f0"/>
    <rect x="256" y="320" width="24" height="24" fill="#e2e8f0"/>
    <rect x="256" y="352" width="24" height="24" fill="#e2e8f0"/>
    <rect x="256" y="384" width="24" height="24" fill="#e2e8f0" opacity="0.9"/>
    <rect x="256" y="416" width="24" height="24" fill="#e2e8f0" opacity="0.85"/>
    <rect x="256" y="448" width="24" height="24" fill="#e2e8f0" opacity="0.8"/>
    <!-- Second column -->
    <rect x="288" y="64" width="24" height="24" fill="#e2e8f0" opacity="0.8"/>
    <rect x="288" y="96" width="24" height="24" fill="#e2e8f0" opacity="0.75"/>
    <rect x="288" y="128" width="24" height="24" fill="#e2e8f0" opacity="0.85"/>
    <rect x="288" y="160" width="24" height="24" fill="#e2e8f0" opacity="0.9"/>
    <rect x="288" y="192" width="24" height="24" fill="#e2e8f0" opacity="0.8"/>
    <rect x="288" y="224" width="24" height="24" fill="#e2e8f0" opacity="0.85"/>
    <rect x="288" y="256" width="24" height="24" fill="#e2e8f0" opacity="0.7"/>
    <rect x="288" y="288" width="24" height="24" fill="#e2e8f0" opacity="0.9"/>
    <rect x="288" y="320" width="24" height="24" fill="#e2e8f0" opacity="0.8"/>
    <rect x="288" y="352" width="24" height="24" fill="#e2e8f0" opacity="0.75"/>
    <rect x="288" y="384" width="24" height="24" fill="#e2e8f0" opacity="0.7"/>
    <rect x="288" y="416" width="24" height="24" fill="#e2e8f0" opacity="0.6"/>
    <!-- Third column — sparser -->
    <rect x="320" y="128" width="24" height="24" fill="#e2e8f0" opacity="0.6"/>
    <rect x="320" y="160" width="24" height="24" fill="#e2e8f0" opacity="0.7"/>
    <rect x="320" y="192" width="24" height="24" fill="#e2e8f0" opacity="0.5"/>
    <rect x="320" y="256" width="24" height="24" fill="#e2e8f0" opacity="0.65"/>
    <rect x="320" y="288" width="24" height="24" fill="#e2e8f0" opacity="0.55"/>
    <rect x="320" y="320" width="24" height="24" fill="#e2e8f0" opacity="0.6"/>
    <rect x="320" y="352" width="24" height="24" fill="#e2e8f0" opacity="0.5"/>
    <!-- Fourth column — very sparse -->
    <rect x="352" y="192" width="24" height="24" fill="#e2e8f0" opacity="0.45"/>
    <rect x="352" y="224" width="24" height="24" fill="#e2e8f0" opacity="0.4"/>
    <rect x="352" y="288" width="24" height="24" fill="#e2e8f0" opacity="0.35"/>
    <rect x="352" y="320" width="24" height="24" fill="#e2e8f0" opacity="0.3"/>
    <!-- Fifth column — barely visible -->
    <rect x="384" y="224" width="24" height="24" fill="#e2e8f0" opacity="0.25"/>
    <rect x="384" y="256" width="24" height="24" fill="#e2e8f0" opacity="0.2"/>
    <rect x="384" y="288" width="24" height="24" fill="#e2e8f0" opacity="0.15"/>
  </g>
</svg>
