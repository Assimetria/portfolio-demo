<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Creative Portfolio logo-mark: geometric overlapping shapes -->
  <g transform="translate(256, 256)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="#8B5CF6" stroke-width="8"/>
    <!-- Purple triangle (top-right) -->
    <polygon points="0,-200 160,0 0,0" fill="#8B5CF6" opacity="0.9"/>
    <!-- Amber triangle (bottom-left) -->
    <polygon points="0,200 -160,0 0,0" fill="#F59E0B" opacity="0.85"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="60" fill="#1a1a2e"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="20" fill="#F59E0B"/>
    <!-- Small accent circles on the triangle edges -->
    <circle cx="100" cy="-60" r="12" fill="#A78BFA" opacity="0.7"/>
    <circle cx="-100" cy="60" r="12" fill="#FCD34D" opacity="0.7"/>
  </g>
</svg>
