<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <!-- Creative Portfolio wordmark-dark: dark geometric mark + dark text (for light backgrounds) -->
  <g transform="translate(10, 10)">
    <circle cx="80" cy="80" r="72" fill="none" stroke="#1a1a2e" stroke-width="3"/>
    <polygon points="80,20 130,100 80,100" fill="#1a1a2e" opacity="0.9"/>
    <polygon points="80,140 30,60 80,60" fill="#B45309" opacity="0.85"/>
    <circle cx="80" cy="80" r="18" fill="#ffffff"/>
    <circle cx="80" cy="80" r="6" fill="#B45309"/>
  </g>
  <text x="185" y="110" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="600" fill="#1a1a2e" letter-spacing="-0.02em" dominantBaseline="central" textAnchor="start">Creative Portfolio</text>
</svg>
