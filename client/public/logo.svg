<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200">
  <!-- Creative Portfolio full logo: geometric mark + wordmark -->
  <g transform="translate(10, 10)">
    <!-- Creative geometric mark: overlapping shapes -->
    <circle cx="80" cy="80" r="72" fill="none" stroke="#8B5CF6" stroke-width="3"/>
    <polygon points="80,20 130,100 80,100" fill="#8B5CF6" opacity="0.9"/>
    <polygon points="80,140 30,60 80,60" fill="#F59E0B" opacity="0.85"/>
    <circle cx="80" cy="80" r="18" fill="#1a1a2e"/>
    <circle cx="80" cy="80" r="6" fill="#F59E0B"/>
  </g>
  <text x="185" y="110" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="600" fill="#1a1a2e" letter-spacing="-0.02em" dominant-baseline="central" text-anchor="start">Creative Portfolio</text>
  <text x="185" y="155" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400" fill="#8B5CF6" letter-spacing="0.04em" dominant-baseline="central" text-anchor="start">DESIGN · ART · DIGITAL</text>
</svg>
