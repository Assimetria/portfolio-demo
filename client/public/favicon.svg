<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Simplified favicon: circle + pixel dissolve optimized for 16-32px -->
  <defs><clipPath id="c"><circle cx="16" cy="16" r="15"/></clipPath></defs>
  <circle cx="16" cy="16" r="15" fill="#1a1a2e"/>
  <g clip-path="url(#c)">
    <rect x="1" y="1" width="15" height="30" fill="#e2e8f0"/>
    <!-- Dissolve col 1 -->
    <rect x="16" y="5" width="4" height="4" fill="#e2e8f0"/>
    <rect x="16" y="11" width="4" height="4" fill="#e2e8f0"/>
    <rect x="16" y="17" width="4" height="4" fill="#e2e8f0"/>
    <rect x="16" y="23" width="4" height="4" fill="#e2e8f0" opacity="0.85"/>
    <!-- Dissolve col 2 -->
    <rect x="21" y="9" width="3" height="3" fill="#e2e8f0" opacity="0.7"/>
    <rect x="21" y="16" width="3" height="3" fill="#e2e8f0" opacity="0.6"/>
    <rect x="21" y="22" width="3" height="3" fill="#e2e8f0" opacity="0.5"/>
    <!-- Dissolve col 3 -->
    <rect x="25" y="13" width="3" height="3" fill="#e2e8f0" opacity="0.35"/>
    <rect x="25" y="19" width="3" height="3" fill="#e2e8f0" opacity="0.25"/>
  </g>
</svg>
