  <rect x="908" y="248" width="60" height="8" rx="4" fill="#475569"/>

  <rect x="700" y="312" width="192" height="120" rx="8" fill="#334155"/>
  <rect x="700" y="336" width="80" height="12" rx="6" fill="#A78BFA" opacity="0.6"/>
  <rect x="700" y="354" width="120" height="8" rx="4" fill="#475569"/>
  <rect x="700" y="368" width="100" height="8" rx="4" fill="#475569"/>
  <rect x="700" y="384" width="60" height="8" rx="4" fill="#475569"/>

