  <rect x="700" y="218" width="120" height="8" rx="4" fill="#475569"/>
  <rect x="700" y="232" width="100" height="8" rx="4" fill="#475569"/>
  <rect x="700" y="248" width="60" height="8" rx="4" fill="#475569"/>

