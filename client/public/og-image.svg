<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg-glow" cx="30%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#4C1D95" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect width="1200" height="630" fill="url(#bg-glow)"/>

  <!-- Geometric decorative shapes -->
  <circle cx="1050" cy="150" r="180" fill="#8B5CF6" opacity="0.08"/>
  <circle cx="1100" cy="500" r="120" fill="#F59E0B" opacity="0.06"/>
  <polygon points="100,500 200,380 300,500" fill="#8B5CF6" opacity="0.05"/>
  <polygon points="150,520 250,400 350,520" fill="#F59E0B" opacity="0.04"/>

  <!-- Logo mark -->
  <g transform="translate(80, 80)">
    <circle cx="60" cy="60" r="55" fill="none" stroke="#8B5CF6" stroke-width="4"/>
    <polygon points="60,12 105,75 60,75" fill="#8B5CF6" opacity="0.9"/>
    <polygon points="60,108 15,45 60,45" fill="#F59E0B" opacity="0.85"/>
    <circle cx="60" cy="60" r="14" fill="#1a1a2e"/>
    <circle cx="60" cy="60" r="5" fill="#F59E0B"/>
  </g>

  <!-- Brand name -->
  <text x="215" y="128" font-family="Inter, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#f1f5f9" letter-spacing="-1">Creative Portfolio</text>

  <!-- Tagline -->
  <text x="80" y="290" font-family="Inter, -apple-system, sans-serif" font-size="26" font-weight="400" fill="#A78BFA">A showcase of creative work</text>

  <!-- Accent divider -->
  <rect x="80" y="320" width="80" height="4" rx="2" fill="url(#accent-line)"/>

  <!-- Description -->
  <text x="80" y="370" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#94a3b8">Design, art, and digital experiences</text>
  <text x="80" y="398" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#64748b">Portfolio template for creative professionals</text>

  <!-- Right panel: project gallery mockup -->
  <rect x="680" y="100" width="440" height="440" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="680" y="100" width="440" height="56" rx="16" fill="#273348"/>
  <rect x="680" y="140" width="440" height="16" fill="#273348"/>
  <circle cx="708" cy="128" r="8" fill="#ef4444" opacity="0.8"/>
  <circle cx="732" cy="128" r="8" fill="#f59e0b" opacity="0.8"/>
  <circle cx="756" cy="128" r="8" fill="#22c55e" opacity="0.8"/>

