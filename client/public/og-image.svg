<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg-glow" cx="30%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="1"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="630" fill="url(#bg-glow)"/>

  <!-- Left content column -->
  <!-- Product name -->
  <text x="80" y="230" font-family="Inter, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#f1f5f9" letter-spacing="-1">SaaS Stack</text>

  <!-- Tagline -->
  <text x="80" y="290" font-family="Inter, -apple-system, sans-serif" font-size="26" font-weight="400" fill="#94a3b8">Ship your SaaS in days, not months.</text>

  <!-- Divider -->
  <rect x="80" y="320" width="60" height="3" rx="2" fill="#3b82f6"/>

  <!-- Description -->
  <text x="80" y="370" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#64748b">Auth, billing, teams, and dashboard</text>
  <text x="80" y="398" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#64748b">ready out of the box.</text>

  <!-- Right panel: mock UI card -->
  <rect x="700" y="100" width="420" height="430" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- Card header bar -->
  <rect x="700" y="100" width="420" height="52" rx="16" fill="#273348"/>
  <rect x="700" y="136" width="420" height="16" fill="#273348"/>
  <circle cx="728" cy="126" r="8" fill="#ef4444" opacity="0.8"/>
  <circle cx="752" cy="126" r="8" fill="#f59e0b" opacity="0.8"/>
  <circle cx="776" cy="126" r="8" fill="#22c55e" opacity="0.8"/>

  <!-- Card content rows -->
  <rect x="724" y="176" width="120" height="12" rx="6" fill="#334155"/>
  <rect x="724" y="200" width="200" height="8" rx="4" fill="#1e3a5f"/>
  <rect x="724" y="218" width="160" height="8" rx="4" fill="#1e3a5f"/>

  <rect x="724" y="250" width="120" height="12" rx="6" fill="#334155"/>
  <rect x="724" y="274" width="180" height="8" rx="4" fill="#1e3a5f"/>
  <rect x="724" y="292" width="140" height="8" rx="4" fill="#1e3a5f"/>

  <!-- Action button in card -->
  <rect x="724" y="330" width="140" height="36" rx="8" fill="#3b82f6"/>
  <rect x="876" y="330" width="100" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="775" y="354" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Get Started</text>
  <text x="927" y="354" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Learn more</text>

  <!-- Bottom stat row -->
  <rect x="724" y="394" width="80" height="8" rx="4" fill="#1e3a5f"/>
  <rect x="814" y="394" width="80" height="8" rx="4" fill="#1e3a5f"/>
  <rect x="904" y="394" width="60" height="8" rx="4" fill="#1e3a5f"/>

  <rect x="724" y="412" width="50" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="784" y="412" width="50" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="844" y="412" width="50" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>

  <!-- Footer label -->
  <text x="80" y="560" font-family="Inter, -apple-system, sans-serif" font-size="15" fill="#334155">product-template · assimetria.com</text>
</svg>
