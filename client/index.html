<!doctype html>
<html lang="<%= HTML_LANG %>">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Enhanced mobile viewport settings -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />

    <!-- iOS-specific meta tags for PWA-like experience -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="<%= BRAND_NAME %>" />

    <!-- Android/Chrome mobile app configuration -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="<%= BRAND_COLOR || '#64748B' %>" />
    <meta name="color-scheme" content="light dark" />

    <!-- Disable auto-detection of phone numbers (prevents unwanted links) -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Title/description/OG/JSON-LD/lang/fallback are generated by
         client/webpack.config.mjs from brand.json (`site` block) + the merged
         site content (content/@system ← @generated ← @custom) via
         scripts/lib/site-html.cjs. Edit brand.json or the content layers, not this file. -->
    <title><%= SITE_TITLE %></title>

    <meta name="sentry-dsn" content="__SENTRY_DSN__" />

    <!-- Meta description -->
    <meta name="description" content="<%= SITE_DESCRIPTION %>" />

    <link rel="canonical" href="__PAGE_URL__" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="<%= BRAND_NAME %>" />
    <meta property="og:title" content="<%= SITE_TITLE %>" />
    <meta property="og:description" content="<%= SITE_DESCRIPTION %>" />
    <meta property="og:url" content="__PAGE_URL__" />
    <meta property="og:image" content="<%= OG_IMAGE %>" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <%= OG_LOCALE_TAG %>

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="<%= SITE_TITLE %>" />
    <meta name="twitter:description" content="<%= SITE_DESCRIPTION %>" />
    <meta name="twitter:url" content="__PAGE_URL__" />
    <meta name="twitter:image" content="<%= OG_IMAGE %>" />

    <!-- Fonts: generated from brand.json (brandFonts.heading/body/mono) by
         webpack.config.mjs via scripts/lib/brand-fonts.cjs — do not hardcode families -->
    <%= GOOGLE_FONTS_LINK %>

    <!-- JSON-LD structured data: one @graph with the business node
         (type = brand.json site.seo.businessType, default ProfessionalService:
         name, url, telephone, email, address, openingHours, sameAs) + WebSite.
         __APP_URL__ is substituted at container start / per request. -->
    <script type="application/ld+json">
    <%= JSON_LD %>
    </script>

    <!-- Analytics: external script chosen by brand.json site.analytics
         (none | plausible | umami). Never inline — CSP has no unsafe-inline. -->
    <%= ANALYTICS_TAG %>
  </head>
  <body>
    <div id="root">
      <!-- Semantic fallback: the real site content (hero, about, services, contact,
           footer) for crawlers, readers and no-JS visitors before React mounts.
           Generated at build time by scripts/lib/site-html.cjs#siteFallbackHtml;
           client/scripts/prerender.mjs replaces the whole #root with a rendered
           snapshot when Chromium is available. -->
      <%= SITE_FALLBACK_HTML %>
    </div>

    <!-- COOKIE CONSENT — GDPR Art. 7 (#43427).
         cookie-consent.js self-injects #cc-banner before React hydrates so JS users
         see the banner immediately. React CookieConsentBanner defers if #cc-banner
         is already in the DOM, preventing duplicates. -->
    <script src="/cookie-consent.js"></script>

    <!-- noscript fallback for no-JS users -->
    <noscript>
      <div id="cc-noscript" role="dialog" aria-label="Cookie consent" style="position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#f8fafc;border-top:1px solid #e2e8f0;padding:1rem 1.5rem;font-family:<%= BRAND_FONT_BODY %>;font-size:0.875rem;color:#334155;text-align:center;line-height:1.6;">
        This site uses cookies for essential functionality and analytics.
        By continuing to browse, you accept our use of essential cookies.
        <a href="/cookies" style="color:<%= BRAND_COLOR || '#64748B' %>;text-decoration:underline;">Cookie Policy</a>
      </div>
    </noscript>
  </body>
</html>
